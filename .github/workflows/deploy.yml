name: Deploy IELTS Practice

on:
  workflow_dispatch:
  push:
    paths:
      - "IELTS-practice-0.6.3.tar.gz"
      - ".github/workflows/deploy.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Extract website
        run: |
              rm -rf site /tmp/ielts
              mkdir -p site /tmp/ielts
              tar -xzf IELTS-practice-0.6.3.tar.gz -C /tmp/ielts
              cp -a /tmp/ielts/IELTS-practice-0.6.3/. site/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
